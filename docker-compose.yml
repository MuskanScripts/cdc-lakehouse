name: cdc-lakehouse

# Week 1 stack: Postgres (logical WAL) -> Debezium (Kafka Connect) -> Kafka (KRaft) + Schema Registry
# plus MinIO (S3 API) and a Spark client container for Week 2.
# Needs ~6 GB RAM free for Docker.

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    command:
      - postgres
      - -c
      - wal_level=logical            # required for logical replication / CDC
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB   # protects disk if Debezium is down for hours
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3          # CDC topics get 3 partitions, keyed by primary key
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  connect:
    build:
      context: ./connect
      args:
        CP_VERSION: "7.7.1"
        DEBEZIUM_VERSION: "2.7.3.Final"
    image: cdc-lakehouse/connect:local
    container_name: connect
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: cdc-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_LOG4J_LOGGERS: org.reflections=ERROR
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minio:minio12345@minio:9000
    command: ["mb", "--ignore-existing", "local/lakehouse"]
    restart: on-failure

  spark:
    image: apache/spark:3.5.3-python3
    container_name: spark
    user: root
    command: ["tail", "-f", "/dev/null"]   # client container; jobs are launched with spark-submit
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    volumes:
      - ./spark:/opt/project/spark
      - ./streaming:/opt/project/streaming
      - ./tests:/opt/project/tests
      - ./simulator:/opt/project/simulator
      - ./dashboard:/opt/project/dashboard
      - ./monitoring:/opt/project/monitoring
      - ivy_cache:/root/.ivy2
    depends_on: [minio]

  # Bronze + silver streaming queries in one driver JVM (profile `stream`: make stream-up).
  streaming:
    image: apache/spark:3.5.3-python3
    container_name: streaming
    user: root
    profiles: ["stream"]
    restart: unless-stopped
    mem_limit: 4000m          # ADR-022: WSL has 9.7 GB; heap 2200m + ~1.1 GB off-heap measured
    working_dir: /opt/project
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      PYTHONPATH: /opt/project
      PYTHONDONTWRITEBYTECODE: "1"   # no root-owned __pycache__ in the bind-mounted repo
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      S3_ENDPOINT: http://minio:9000
      SILVER_TRIGGER_INTERVAL: ${SILVER_TRIGGER:-10 seconds}   # ADR-034 (make bench-trigger)
    volumes:
      - ./streaming:/opt/project/streaming
      - ivy_cache:/root/.ivy2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[4]
      - --driver-memory
      - ${STREAM_DRIVER_MEMORY:-2200m}
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-avro_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.1,org.apache.hadoop:hadoop-aws:3.3.4
      - --conf
      - spark.jars.ivy=/root/.ivy2
      - /opt/project/streaming/run_all.py

  # Compares Postgres with silver (delta-rs, no JVM). Run via `make reconcile` / `make latency`.
  reconcile:
    build: ./chaos
    image: cdc-lakehouse/chaos:local
    container_name: reconcile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ecom
      PGPASSWORD: ecom
      PGDATABASE: ecom
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      S3_ENDPOINT: http://minio:9000
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./chaos:/app

  # Week 4 gold layer (profile `gold`: make gold-up). dbt-duckdb builds gold from silver Delta in a
  # loop and publishes /data/gold.duckdb; the Streamlit dashboard reads that file (ADR-024).
  dbt:
    build: ./dbt
    image: cdc-lakehouse/gold:local
    container_name: dbt
    profiles: ["gold"]
    restart: unless-stopped
    init: true                # ADR-027: with bash as PID 1 every dbt build lost its ref() dependencies
    mem_limit: 1g
    working_dir: /dbt
    command: ["bash", "/dbt/run_loop.sh"]
    environment: &gold_env
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP: kafka:29092
      DBT_INTERVAL: "30"
      GOLD_BUILD_PATH: /data/gold_build.duckdb
      GOLD_SERVE_PATH: /data/gold.duckdb
      # the DQ gate reads the source's newest change for its freshness check (ADR-030)
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ecom
      PGPASSWORD: ecom
      PGDATABASE: ecom
    volumes:
      - ./dbt:/dbt
      - ./quality:/quality      # Week 5: Soda checks + dq.py, run by cycle.sh and by Airflow (ADR-029)
      - gold_data:/data
    depends_on: [minio]

  dashboard:
    image: cdc-lakehouse/gold:local
    pull_policy: never        # built by the dbt service (same image)
    container_name: dashboard
    profiles: ["gold"]
    restart: unless-stopped
    mem_limit: 512m
    working_dir: /app
    environment: *gold_env
    command: ["streamlit", "run", "/app/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - gold_data:/data:ro
    depends_on: [dbt]

  # Week 5 orchestration (profile `orchestration`: make airflow-up). One container, scheduler +
  # webserver, LocalExecutor, metadata in database `airflow` on the same Postgres (ADR-029).
  # Tasks run inside the stack's containers through the Docker socket (lakehouse_lib.py).
  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: airflow
    profiles: ["orchestration"]
    restart: unless-stopped
    init: true                # ADR-027: never a shell as PID 1; also reaps LocalExecutor task processes
    mem_limit: 1500m
    user: "50000:0"
    group_add: ["${DOCKER_GID:-1001}"]   # gid of /var/run/docker.sock (`make airflow-up` sets it)
    command: ["bash", "/opt/airflow/start.sh"]
    ports:
      - "8088:8080"
    environment:
      # the image's entrypoint would wait for the metadata DB BEFORE start.sh can create it
      CONNECTION_CHECK_MAX_COUNT: "0"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "120"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"   # 120 s was missed under full CPU load (ADR-033)
      AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "0"    # no rolling gunicorn restarts (each one doubles memory)
      AIRFLOW__WEBSERVER__SECRET_KEY: lakehouse-local-only
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}               # unset -> alerts are logged only
      SRC_PGHOST: postgres
      SRC_PGUSER: ecom
      SRC_PGPASSWORD: ecom
      SRC_PGDATABASE: ecom
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/start.sh:/opt/airflow/start.sh:ro
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  # Week 5 monitoring (profile `monitoring`: make monitoring-up), ADR-031.
  pipeline-exporter:
    image: cdc-lakehouse/gold:local
    pull_policy: never        # built by the dbt service (same image)
    container_name: pipeline-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    init: true
    mem_limit: 256m
    command: ["python", "/monitoring/exporter.py"]
    environment:
      <<: *gold_env
      HEALTH_PATH: /app
    volumes:
      - ./monitoring:/monitoring:ro
      - ./dashboard:/app:ro
      - gold_data:/data:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    init: true
    mem_limit: 300m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d",
              "--storage.tsdb.path=/prometheus"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    init: true
    mem_limit: 300m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lakehouse
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lakehouse.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["ui"]          # Week 5: no longer started by `make up` (memory); `make kafka-ui`
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083

  simulator:
    build: ./simulator
    image: cdc-lakehouse/simulator:local
    container_name: simulator
    profiles: ["sim"]      # only runs via `make simulate`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ecom
      PGPASSWORD: ecom
      PGDATABASE: ecom

volumes:
  pg_data:
  kafka_data:
  minio_data:
  ivy_cache:
  gold_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
