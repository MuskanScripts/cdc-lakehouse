# CI without the Docker stack: the same unit tests `make test` runs, plus `dbt parse`.
# Versions mirror the containers: the spark image (Python 3.8, Java 11, PySpark 3.5.3) and the gold
# image (Python 3.12, dbt 1.9.1, Soda venv with duckdb 1.1.3 forced, ADR-030).
name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: unit tests (PySpark, simulator, dashboard, exporter)
    runs-on: ubuntu-22.04          # still has Python 3.8, which the spark image runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Cache Ivy (Delta + spark-avro jars the tests resolve)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-spark3.5.3-delta3.2.1
      - run: pip install pyspark==3.5.3 pytest==8.3.4 Faker==30.8.2 "psycopg[binary]==3.2.3"
      - run: python -m pytest -q -p no:cacheprovider tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  dq-tests:
    name: data quality tests (Soda)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Soda venv, as in dbt/Dockerfile
        run: |
          pip install soda-core-duckdb==3.5.6 setuptools==75.6.0 deltalake==0.22.3 pyarrow \
            "psycopg[binary]==3.2.3" pyyaml pytest==8.3.4
          pip install --no-deps duckdb==1.1.3
          mkdir -p ~/.soda && printf 'send_anonymous_usage_stats: false\n' > ~/.soda/config.yml
      - run: python -m pytest -q -p no:cacheprovider quality/tests

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-core==1.9.1 dbt-duckdb==1.9.1 duckdb==1.1.3 deltalake==0.22.3
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          GOLD_BUILD_PATH: /tmp/gold_build.duckdb
